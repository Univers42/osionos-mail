# The app's own gate: what a release must pass, nothing vacuous. Reproduced green in
# node:22-alpine before this workflow existed (npm ci, tsc --noEmit clean, vite build ok).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    name: tsc --noEmit + vite build (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Bridge parses
        run: node --check bridge/server.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # One Pages deployment per branch head: develop → https://develop.osionos-mail.pages.dev
  # (beta), main → https://osionos-mail.pages.dev (release). The bridge URLs are built empty
  # on purpose: Pages serves the static preview (ADR 0030 in groot, Phase 1); the connector
  # appears only in a bundle built with a bridge URL. The run ends by reading the served
  # page's build meta back, so a green run means the sha is live, not just uploaded.
  deploy-pages:
    name: Cloudflare Pages (${{ github.ref_name }})
    needs: typecheck-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: pages-osionos-mail-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      META: osionos-mail-build
      URL: ${{ github.ref_name == 'develop' && 'https://develop.osionos-mail.pages.dev' || 'https://osionos-mail.pages.dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Build with the commit sha as build meta
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_MAIL_BRIDGE_URL: ""
        run: npm run build
      - name: dist carries the build meta and the SPA fallback
        run: |
          grep -q "name=\"$META\" content=\"$GITHUB_SHA\"" dist/index.html || { echo "::error::dist/index.html does not carry build meta $GITHUB_SHA"; exit 1; }
          test -f dist/_redirects || { echo "::error::dist/_redirects missing (SPA fallback)"; exit 1; }
          test -f dist/_headers || { echo "::error::dist/_headers missing"; exit 1; }
      - name: Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is unset (gh secret set CLOUDFLARE_API_TOKEN -R Univers42/osionos-mail)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is unset (gh secret set CLOUDFLARE_ACCOUNT_ID -R Univers42/osionos-mail)"; exit 1; }
      # Idempotent on purpose: the project exists after the first run. Caveat: continue-on-error
      # also hides a permission error here; the deploy that follows catches it.
      - name: Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: pages project create osionos-mail --production-branch main
      - name: Deploy to Pages (branch = ref)
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: pages deploy ./dist --project-name osionos-mail --branch ${{ github.ref_name }} --commit-hash ${{ github.sha }} --commit-dirty=false
      # Caveat: a copy of groot's scripts/pages-wait.sh (no cross-repo checkout here, ADR 0030
      # C1). It reads whichever CDN edge curl reaches; a visitor behind another edge can still
      # see the previous sha for a while after this passes.
      - name: The served page carries the deployed sha
        run: |
          elapsed=0
          while :; do
            last=$(curl -fsS -H 'Cache-Control: no-cache' "$URL" 2>/dev/null | grep -o "<meta name=\"$META\" content=\"[^\"]*\"" | head -1 | sed 's/.*content="\([^"]*\)".*/\1/' || true)
            [ -n "$last" ] || last="(unreachable)"
            [ "$last" != "$GITHUB_SHA" ] || { echo "$URL serves $GITHUB_SHA"; echo "deployed $GITHUB_SHA to $URL" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            case "$last" in %*%) echo "::error::$URL serves the literal meta '$last': built without VITE_APP_VERSION"; exit 3 ;; esac
            [ "$elapsed" -lt 900 ] || { echo "::error::$URL did not serve $GITHUB_SHA within 900s; last meta: $last"; exit 1; }
            sleep 20; elapsed=$((elapsed + 20))
          done
