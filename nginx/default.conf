# The prod image's only server. The HTML is revalidated on every load, so a deploy reaches a
# browser (and the osionos frame) at once; with no Cache-Control the browser cached index.html
# heuristically and kept asking for bundles that no longer exist (groot, 2026-11-04). The
# hashed bundles under /assets/ never change, so they are cached for a year.
server {
	listen 80;
	root /usr/share/nginx/html;

	location / {
		add_header Cache-Control "no-cache" always;
		try_files $uri $uri/ =404;
	}

	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}
}
